
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Juegos Retro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101b;color:white;font-family:Arial,sans-serif}
header{padding:25px 15px;text-align:center;background:linear-gradient(120deg,#5d18c7,#ec277e)}
h1{margin:0;font-size:30px}
header p{margin-bottom:0}
main{max-width:1000px;margin:auto;padding:18px}
input,select,button{padding:12px;border:0;border-radius:9px;font-size:15px}
input{width:100%;margin-bottom:12px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{background:#7928ca;color:white;cursor:pointer}
button:hover{background:#a344fa}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.game{background:#202034;border:1px solid #393954;border-radius:13px;padding:15px;text-align:center}
.emoji{font-size:42px}
.game h3{margin:8px 0}
.game p{color:#c7c7dc;font-size:13px}
#player{margin-top:20px;background:#202034;padding:14px;border-radius:12px}
#game{width:100%;min-height:300px}
#status{color:#ffda7b}
footer{text-align:center;color:#aaa;padding:25px}
</style>
</head>
<body>
<header>
<h1>🎮 PLAY JUEGOS</h1>
<p>Tu zona de juegos retro</p>
</header>
<main>
<h2>🕹️ Biblioteca de juegos</h2>
<input id="search" placeholder="Buscar juego o consola...">
<nav>
<button onclick="filter('Todos')">Todos</button>
<button onclick="filter('Aventura')">Aventura</button>
<button onclick="filter('Carreras')">Carreras</button>
<button onclick="filter('Arcade')">Arcade</button>
<button onclick="filter('Deportes')">Deportes</button>
<button onclick="filter('Lucha')">Lucha</button>
</nav>
<div id="games" class="grid"></div>

<section id="player">
<h2 id="gameTitle">🎯 Emulador</h2>
<p>Selecciona un juego compatible o carga un archivo de juego propio.</p>
<label for="system">Consola:</label>
<select id="system" style="width:100%;margin:10px 0">
<option value="nes">Nintendo NES</option>
<option value="snes">Super Nintendo</option>
<option value="gb">Game Boy</option>
<option value="gba">Game Boy Advance</option>
<option value="segaMD">Sega Mega Drive</option>
<option value="arcade">Arcade (MAME)</option>
</select>
<input id="rom" type="file" accept=".nes,.sfc,.smc,.gb,.gbc,.gba,.bin,.gen,.md,.zip">
<button onclick="startGame()">▶ Cargar y jugar</button>
<p id="status">Selecciona un archivo compatible para comenzar.</p>
<div id="game"></div>
</section>
</main>
<footer>Play Juegos Retro · Hecho en Android con Termux</footer>

<script>
const games=[
["Aventura","🗺️","Aventura retro","NES"],
["Carreras","🏎️","Carreras arcade","Arcade"],
["Arcade","👾","Invasores espaciales","Arcade"],
["Deportes","⚽","Fútbol retro","SNES"],
["Lucha","🥊","Combate clásico","Arcade"],
["Aventura","🐉","Mundos fantásticos","GBA"],
["Carreras","🏁","Velocidad extrema","Mega Drive"],
["Arcade","🚀","Batalla espacial","NES"],
["Deportes","🏀","Baloncesto retro","SNES"],
["Aventura","💎","Búsqueda del tesoro","Game Boy"],
["Lucha","⚔️","Duelo de campeones","GBA"],
["Arcade","🧱","Rompe bloques","NES"]
];
let category="Todos";
function render(){
const q=document.getElementById("search").value.toLowerCase();
document.getElementById("games").innerHTML=games
.filter(g=>(category==="Todos"||g[0]===category)&&g.join(" ").toLowerCase().includes(q))
.map(g=>`<article class="game"><div class="emoji">${g[1]}</div><h3>${g[2]}</h3><p>${g[0]} · ${g[3]}</p><button onclick="choose('${g[2]}','${g[3]}')">Seleccionar</button></article>`).join("");
}
function filter(c){category=c;render()}
function choose(name,system){
document.getElementById("gameTitle").textContent="🎮 "+name;
const map={"NES":"nes","SNES":"snes","GBA":"gba","Game Boy":"gb","Mega Drive":"segaMD","Arcade":"arcade"};
document.getElementById("system").value=map[system]||"nes";
document.getElementById("player").scrollIntoView({behavior:"smooth"});
document.getElementById("status").textContent="Carga un archivo de juego autorizado para jugar.";
}
document.getElementById("search").addEventListener("input",render);
function startGame(){
const file=document.getElementById("rom").files[0];
if(!file){document.getElementById("status").textContent="Primero selecciona un archivo de juego.";return;}
const core=document.getElementById("system").value;
const url=URL.createObjectURL(file);
document.getElementById("game").innerHTML="";
document.getElementById("status").textContent="Cargando emulador...";
window.EJS_player="#game";
window.EJS_core=core;
window.EJS_gameUrl=url;
window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
const old=document.getElementById("emulatorLoader");
if(old)old.remove();
const script=document.createElement("script");
script.id="emulatorLoader";
script.src="https://cdn.emulatorjs.org/stable/data/loader.js";
script.onload=()=>document.getElementById("status").textContent="Emulador cargado. Si no aparece el juego, revisa la compatibilidad del archivo.";
script.onerror=()=>document.getElementById("status").textContent="No se pudo cargar el emulador. Revisa tu conexión.";
document.body.appendChild(script);
}
render();
</script>
</body>
</html>
